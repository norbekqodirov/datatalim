
server {
    server_name datatalim.uz www.datatalim.uz;

    root /var/www/datatalim/dist;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================
    # GZIP COMPRESSION
    # ==========================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # ==========================
    # STATIC ASSETS CACHING
    # ==========================
    # Cache all JS and CSS files generated by Vite for 1 Year (since they are hashed and immutable)
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache Images, Fonts, and Medias
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf|otf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/datatalim.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/datatalim.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.datatalim.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = datatalim.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name datatalim.uz www.datatalim.uz;
    return 404; # managed by Certbot




}