
# Rate limit zonalari (http kontekst; bu fayl sites-enabled orqali http{} ichiga include qilinadi)
limit_req_zone $binary_remote_addr zone=dt_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dt_login:10m rate=30r/m;

# Brauzer WebP qabul qilsa, kurs muqovalari (.png, ~650 kB) o'rniga yonidagi .webp (~50 kB) beriladi
map $http_accept $dt_webp {
    default       "";
    "~*image/webp" ".webp";
}

server {
    server_name datatalim.uz www.datatalim.uz;
    server_tokens off;

    root /var/www/datatalim/dist;
    index index.html index.htm;

    # Nuqta bilan boshlanadigan yashirin fayllar (.env, .git ...) hech qachon berilmasin; faqat certbot uchun .well-known ochiq
    location ~ /\.(?!well-known) {
        return 404;
    }

    # --- Siqish (gzip) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json application/xml text/xml image/svg+xml font/ttf font/otf application/x-font-ttf;

    # --- Xavfsizlik headerlari ---
    # DIQQAT: nginx'da location ichida kamida bitta add_header bo'lsa, server darajasidagi add_header'lar
    # u location'ga MEROS QILINMAYDI. Shuning uchun bu 5 qator quyidagi har bir statik location'da takrorlangan
    # (/api va /uploads'da add_header yo'q — ular merosni oladi; Express'ning bir xil headerlari proxy_hide_header bilan olib tashlanadi, takror bo'lmasligi uchun).
    # Qat'iy CSP ataylab yo'q (YouTube, Meta Pixel, Google Fonts ishlashi kerak). HSTS faqat shu 443 blokda.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HTML (index.html): har safar serverdan tekshiriladi (ETag -> 304), shunda yangi deploydan keyin eski JS yo'llari qolmaydi.
    # "no-store" EMAS, "no-cache": 304 bilan tez ochiladi va brauzerning orqaga/oldinga (bfcache) keshi ishlaydi.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Vite hash'li fayllari (/assets/*) o'zgarmas: 1 yil, immutable. Yo'q fayl uchun index.html emas, 404.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Kurs muqovalari: /images/courses/x.png so'ralganda WebP qabul qiladigan brauzerga x.webp beriladi.
    # (CourseDetail/Courses sahifalari hali ham .png yo'lini so'raydi; bu 650 kB -> 50 kB.) Vary: Accept shart.
    # Hash'siz fayl bo'lgani uchun 30 kun (immutable emas): admin xuddi shu nomni almashtirsa, bir oyda yangilanadi.
    location ~* ^/images/courses/(?<cover>[^/]+)\.png$ {
        try_files /images/courses/$cover$dt_webp $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header Vary "Accept";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Shriftlar: o'zgarmaydi -> 1 yil, immutable
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Rasmlar/ikonkalar (public/ dagi hash'siz fayllar): 30 kun + fonda yangilash. /uploads/ bu yerga tushmaydi (^~ pastda).
    location ~* \.(?:webp|png|jpe?g|gif|ico|svg|avif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Hash'siz css/js (Vite ularni /assets/ ga qo'yadi; bu faqat zaxira): 1 kun
    location ~* \.(?:css|js|mjs)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # robots.txt, sitemap.xml, manifest: 1 soat (qidiruv botlari tez-tez o'qiydi, lekin o'zgarsa tez yangilansin)
    location ~ ^/(?:robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Admin login: nginx darajasida qo'shimcha to'siq (Express limiti ham bor)
    location = /api/admin/login {
        limit_req zone=dt_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location /api/ {
        limit_req zone=dt_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Haqiqiy mijoz IP'si Express'ga yetib borishi uchun (rate limit har IP bo'yicha ishlaydi; Express: trust proxy = 1)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
        # Express o'z security headerlarini beradi — nginx'ning (server darajasidagi) nusxasi bilan takrorlanmasin
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # ^~ : stop nginx from falling through to the image-caching regex above for
    # anything under /uploads/ — this must be proxied to Node/Express, never
    # served as a static file relative to root (dist/).
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/datatalim.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/datatalim.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.datatalim.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = datatalim.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name datatalim.uz www.datatalim.uz;
    return 404; # managed by Certbot




}
