    <style>
      /* Yorug' rejim (standart) */
      .dt-loader { display:flex;align-items:center;justify-content:center;height:100vh;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif }
      .dt-spinner { width:48px;height:48px;border:3px solid rgba(15,23,42,0.1);border-top-color:#0061ff;border-radius:50%;animation:dtSpin 0.8s linear infinite;margin:0 auto }
      .dt-loader-text { margin-top:20px;color:#64748b;font-size:14px;font-weight:500;letter-spacing:0.5px }
      @media (prefers-color-scheme: dark) {
        .dt-loader { background:#0f172a }
        .dt-spinner { border-color:rgba(255,255,255,0.1);border-top-color:#60efff }
        .dt-loader-text { color:#94a3b8 }
      }
      @keyframes dtSpin {
        to {
          transform: rotate(360deg)
        }
      }
    </style>
  </div>
